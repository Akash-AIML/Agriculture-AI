name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP: agri-ai
  AZURE_RESOURCE_GROUP: agri-ai-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compute lowercase image name (Docker requires all lowercase)
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/agri-ai" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.AZURE_CONTAINER_APP }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.IMAGE }}:${{ github.sha }}
          targetPort: 8080
          ingress: external
          environmentVariables: CORS_ORIGINS=* PORT=8080 OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }} LLM_MODEL=${{ secrets.LLM_MODEL }}

      - name: Inspect Container App Env
        run: |
          echo "=== Provisioning State ==="
          az containerapp show -n agri-ai -g agri-ai-rg --query "properties.provisioningState"
          echo "=== Revisions Table ==="
          az containerapp revision list -n agri-ai -g agri-ai-rg -o table
          echo "=== Container Logs ==="
          az containerapp logs show -n agri-ai -g agri-ai-rg --tail 100
