name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP: agri-ai
  AZURE_RESOURCE_GROUP: agri-ai-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compute lowercase image name (Docker requires all lowercase)
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/agri-ai" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          no-cache: true

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.AZURE_CONTAINER_APP }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.IMAGE }}:${{ github.sha }}
          targetPort: 8080
          ingress: external

      - name: Get container startup logs
        if: always()
        run: |
          echo "=== Waiting 30s for container to boot ==="
          sleep 30
          echo "=== Revisions ==="
          az containerapp revision list -n agri-ai -g agri-ai-rg -o table
          LATEST=$(az containerapp show -n agri-ai -g agri-ai-rg --query "properties.latestRevisionName" -o tsv)
          echo "=== Logs for $LATEST ==="
          az containerapp logs show -n agri-ai -g agri-ai-rg --revision "$LATEST" --tail 200 || true
